<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#1A237E">
  <title>Palpites — Bolão Copa 2026</title>
  <link rel="stylesheet" href="style.css">
  <script src="config.js"></script>
  <style>
    /* Botão salvar flutuante */
    .fab-salvar {
      position: fixed;
      bottom: calc(4.5rem + env(safe-area-inset-bottom));
      right: 1rem;
      background: var(--azul);
      color: #fff;
      border: none;
      border-radius: 28px;
      padding: .75rem 1.3rem;
      font-size: .9rem;
      font-weight: 800;
      box-shadow: 0 4px 16px rgba(26,35,126,.4);
      cursor: pointer;
      z-index: 150;
      display: none;
      align-items: center;
      gap: .4rem;
      transition: all .2s;
    }
    .fab-salvar.visivel { display: flex; }
    .fab-salvar:active { transform: scale(.96); }
    .fab-salvar .fab-count {
      background: var(--ouro);
      color: var(--azul);
      border-radius: 10px;
      font-size: .72rem;
      font-weight: 900;
      padding: .1rem .4rem;
      min-width: 1.4rem;
      text-align: center;
    }

    /* Jogo card adaptado */
    .jogo-card { position: relative; }
    .jogo-card.travado {
      opacity: .6;
      pointer-events: none;
      background: #F5F5F5;
    }
    .jogo-card.travado::after {
      content: '🔒';
      position: absolute;
      top: .4rem;
      right: .5rem;
      font-size: .9rem;
    }
    .jogo-card.tem-palpite { border-color: var(--azul-palido); background: var(--azul-fundo); }
    .jogo-card.tem-palpite.travado { border-color: #B0BEC5; background: #ECEFF1; }

    /* Timer regressivo até o bloqueio */
    .jogo-timer {
      font-size: .62rem;
      font-weight: 700;
      color: var(--cinza-sub);
      margin-top: .25rem;
      letter-spacing: .02em;
      white-space: nowrap;
      line-height: 1.3;
    }
    .jogo-timer.urgente { color: var(--ouro-escuro); }
    .jogo-timer.muito-urgente {
      color: #fff;
      background: var(--vermelho);
      border-radius: 4px;
      padding: .08rem .35rem;
      display: inline-block;
      animation: pulse-timer 1s ease-in-out infinite;
    }
    .jogo-timer.encerrado { color: var(--cinza-sub); opacity: .7; }
    @keyframes pulse-timer { 50% { opacity: .5; } }

    /* Palpite salvo exibido */
    .palpite-salvo {
      font-size: .7rem;
      font-weight: 800;
      color: var(--azul);
      text-align: center;
      margin-top: .2rem;
      letter-spacing: .03em;
    }
    .palpite-salvo.travado-txt { color: var(--cinza-sub); }

    /* Atalho pagamento */
    .banner-pagamento {
      background: #FFF3E0;
      border: 2px solid #FFB74D;
      border-radius: var(--radius-sm);
      padding: .8rem 1rem;
      font-size: .83rem;
      color: #4E342E;
      margin-bottom: .8rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: .8rem;
    }
    .banner-pagamento a {
      flex-shrink: 0;
      background: #FF9800;
      color: #fff;
      border-radius: 8px;
      padding: .4rem .8rem;
      font-size: .78rem;
      font-weight: 800;
      text-decoration: none;
      white-space: nowrap;
    }

    /* Inputs travados */
    input[disabled] {
      background: #ECEFF1 !important;
      color: var(--cinza-sub) !important;
      cursor: not-allowed;
    }
  </style>
</head>
<body>

<header>
  <span class="logo">⚽</span>
  <div class="header-texto">
    <h1>Meus Palpites</h1>
  </div>
  <nav>
    <a href="index.html">Início</a>
    <a href="ranking.html">Ranking</a>
    <a href="palpites.html" class="ativo">Palpites</a>
    <a href="minha-pontuacao.html">Pontuação</a>
    <a href="regulamento.html">Regras</a>
  </nav>
</header>

<!-- FAB salvar flutuante -->
<button class="fab-salvar" id="fabSalvar" onclick="salvarTudo()">
  💾 Salvar <span class="fab-count" id="fabCount">0</span>
</button>

<div class="container">

  <!-- Login -->
  <div id="telaLogin" class="card">
    <p class="card-titulo">Acessar palpites</p>
    <div class="form-group">
      <label>Código de participante</label>
      <input type="text" id="inputId" placeholder="BP123456"
             style="text-transform:uppercase;letter-spacing:.12em;font-size:1.3rem;font-weight:900;text-align:center;"
             onkeydown="if(event.key==='Enter')verificarAcesso()"
             inputmode="text" autocomplete="off">
    </div>
    <button class="btn btn-primary btn-block" onclick="verificarAcesso()">Entrar</button>
    <p style="text-align:center;margin-top:.8rem;font-size:.82rem;color:var(--cinza-sub);">
      Esqueceu o código? <a href="index.html" style="color:var(--azul);font-weight:700;">Recuperar por e-mail</a>
    </p>
  </div>

  <!-- Info participante -->
  <div id="infoParticipante" style="display:none;">
    <div style="display:flex;align-items:center;gap:.8rem;background:var(--branco);border-radius:var(--radius-sm);padding:.8rem 1rem;box-shadow:var(--sombra);margin-bottom:.8rem;">
      <div style="flex:1;min-width:0;">
        <div style="font-weight:800;font-size:.95rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;" id="lblNome"></div>
        <div style="font-size:.73rem;color:var(--cinza-sub);font-family:monospace;" id="lblId"></div>
      </div>
      <div id="statusBadge" style="flex-shrink:0;"></div>
      <button class="btn btn-secondary btn-sm" onclick="sair()">Sair</button>
    </div>
  </div>

  <!-- Atalho pagamento pendente -->
  <div id="bannerPagamento" style="display:none;" class="banner-pagamento">
    <span>⏳ <strong>Pagamento pendente.</strong> Seus palpites serão contabilizados após confirmação.</span>
    <a href="" id="linkPagamento">💳 Pagar</a>
  </div>

  <!-- Área de palpites -->
  <div id="areaPalpites" style="display:none;">

    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:.6rem;gap:.5rem;flex-wrap:wrap;">
      <span id="contadorPalpites" style="font-size:.8rem;color:var(--cinza-sub);font-weight:700;"></span>
      <span id="travasInfo" style="font-size:.75rem;color:var(--cinza-sub);"></span>
      <a href="comprovante.html" target="_blank" rel="noopener" id="linkComprovante"
         style="display:none;font-size:.78rem;font-weight:700;color:var(--azul);background:var(--azul-fundo);padding:.35rem .7rem;border-radius:6px;text-decoration:none;border:1px solid var(--azul-palido);white-space:nowrap;">
        📄 Baixar PDF
      </a>
    </div>

    <div id="listaJogos"></div>

  </div>

</div>



<script>
let participanteId = '';
let participanteStatus = '';
let jogos = [];
const palpites = {};         // palpites editados nesta sessão (não salvos ainda)
const palpitesSalvos = {};   // palpites que já estão no servidor

// ── Verificar prazo para palpitar ─────────────────────────────
// Palpites são bloqueados 5 minutos antes do início do jogo.
const ANTECEDENCIA_MS = 5 * 60 * 1000;

function horarioJogo(jogo) {
  const [h, m] = jogo.hora.replace('h30',':30').replace('h',':00').split(':');
  return new Date(jogo.data + 'T' + String(h).padStart(2,'0') + ':' + (m||'00') + ':00-03:00');
}

function prazoLimite(jogo) {
  return horarioJogo(jogo).getTime() - ANTECEDENCIA_MS;
}

function palpiteEncerrado(jogo) {
  return Date.now() >= prazoLimite(jogo);
}

function formatarTempo(ms) {
  const totalSeg = Math.floor(ms / 1000);
  const d = Math.floor(totalSeg / 86400);
  const h = Math.floor((totalSeg % 86400) / 3600);
  const m = Math.floor((totalSeg % 3600) / 60);
  const s = totalSeg % 60;
  if (d > 0) return `fecha em ${d}d ${h}h`;
  if (h > 0) return `fecha em ${h}h ${String(m).padStart(2,'0')}min`;
  if (m > 0) return `fecha em ${m}min ${String(s).padStart(2,'0')}s`;
  return `fecha em ${s}s`;
}

// ── Acesso ───────────────────────────────────────────────────
async function verificarAcesso() {
  const id = document.getElementById('inputId').value.trim().toUpperCase();
  if (!id) { toast('Digite seu código.', 'erro'); return; }
  const res = await api({ action: 'verificarID', id });
  if (!res.ok) { toast(res.msg, 'erro'); return; }
  participanteId = res.id;
  participanteStatus = res.status;
  localStorage.setItem('bolao_id', participanteId);

  document.getElementById('telaLogin').style.display = 'none';
  document.getElementById('infoParticipante').style.display = '';
  document.getElementById('linkComprovante').style.display = 'inline-block';
  document.getElementById('lblNome').textContent = res.nome;
  document.getElementById('lblId').textContent = res.id;

  const aprovado = res.status === 'APROVADO';
  document.getElementById('statusBadge').innerHTML =
    `<span class="badge badge-${res.status.toLowerCase()}">${aprovado ? '✅ Aprovado' : '⏳ Pendente'}</span>`;

  if (!aprovado) {
    const banner = document.getElementById('bannerPagamento');
    banner.style.display = 'flex';
    document.getElementById('linkPagamento').href = 'inscricao.html?pagar=' + res.id;
  }

  carregarJogos();
}

function sair() { localStorage.removeItem('bolao_id'); location.reload(); }

// ── Carregar jogos e palpites salvos ─────────────────────────
async function carregarJogos() {
  document.getElementById('areaPalpites').style.display = '';

  const [resJogos, resPalp] = await Promise.all([
    api({ action: 'getJogos' }),
    api({ action: 'getMeusPalpites', id: participanteId })
  ]);

  if (!resJogos.ok) { toast('Erro ao carregar jogos.', 'erro'); return; }
  jogos = resJogos.jogos;

  // Carregar palpites já salvos
  if (resPalp.ok && resPalp.palpites) {
    resPalp.palpites.forEach(p => {
      palpitesSalvos[p.jogoId] = { gols1: p.gols1, gols2: p.gols2 };
    });
  }

  let travados = 0;
  const grupos = {};
  jogos.forEach(j => { if (!grupos[j.grupo]) grupos[j.grupo] = []; grupos[j.grupo].push(j); });

  const container = document.getElementById('listaJogos');
  container.innerHTML = '';

  Object.keys(grupos).sort().forEach(grp => {
    container.insertAdjacentHTML('beforeend', `<span class="grupo-titulo">Grupo ${grp}</span>`);
    grupos[grp].forEach(jogo => {
      const travado = palpiteEncerrado(jogo);
      if (travado) travados++;

      const f1 = BANDEIRAS[jogo.time1] || '🏳';
      const f2 = BANDEIRAS[jogo.time2] || '🏳';
      const n1 = NOMES[jogo.time1] || jogo.time1;
      const n2 = NOMES[jogo.time2] || jogo.time2;
      const salvo = palpitesSalvos[jogo.id];

      // Pré-preencher inputs com palpite salvo
      if (salvo) palpites[jogo.id] = { jogoId: jogo.id, gols1: salvo.gols1, gols2: salvo.gols2 };

      const card = document.createElement('div');
      card.className = 'jogo-card' + (travado ? ' travado' : '') + (salvo ? ' tem-palpite' : '');
      card.id = 'card_' + jogo.id;

      const v1 = salvo ? salvo.gols1 : '';
      const v2 = salvo ? salvo.gols2 : '';

      card.innerHTML = `
        <div class="time">
          <span class="bandeira">${f1}</span>
          <span>${n1}</span>
        </div>
        <div style="text-align:center;">
          <div class="jogo-meta">${fmt(jogo.data)} ${jogo.hora}</div>
          <div class="jogo-timer" id="timer_${jogo.id}"></div>
          <div class="placar-inputs" style="flex-direction:row;margin-top:.3rem;">
            <input type="number" min="0" max="30" id="g1_${jogo.id}"
                   value="${v1}" placeholder="?"
                   inputmode="numeric"
                   ${travado ? 'disabled' : `oninput="reg(${jogo.id})"`}>
            <span class="placar-sep">×</span>
            <input type="number" min="0" max="30" id="g2_${jogo.id}"
                   value="${v2}" placeholder="?"
                   inputmode="numeric"
                   ${travado ? 'disabled' : `oninput="reg(${jogo.id})"`}>
          </div>
          ${salvo ? `<div class="palpite-salvo${travado ? ' travado-txt' : ''}">
            ✓ salvo: ${salvo.gols1} × ${salvo.gols2}
          </div>` : ''}
        </div>
        <div class="time time-direita">
          <span>${n2}</span>
          <span class="bandeira">${f2}</span>
        </div>`;
      container.appendChild(card);
    });
  });

  if (travados > 0) {
    document.getElementById('travasInfo').textContent = `🔒 ${travados} jogo(s) encerrado(s) para edição`;
  }

  atualizarContador();
  aplicarTwemoji(container);
  iniciarTimers();
}

// ── Timers regressivos ───────────────────────────────────────
let timerInterval = null;

function iniciarTimers() {
  if (timerInterval) clearInterval(timerInterval);
  atualizarTimers();
  timerInterval = setInterval(atualizarTimers, 1000);
}

function atualizarTimers() {
  const agora = Date.now();
  let travouAlgum = false;

  jogos.forEach(jogo => {
    const el = document.getElementById('timer_' + jogo.id);
    if (!el) return;
    const restante = prazoLimite(jogo) - agora;

    if (restante <= 0) {
      const card = document.getElementById('card_' + jogo.id);
      if (card && !card.classList.contains('travado')) {
        travarCard(jogo);
        travouAlgum = true;
      }
      el.className = 'jogo-timer encerrado';
      el.textContent = '🔒 encerrado';
      return;
    }

    el.textContent = '⏱ ' + formatarTempo(restante);
    if      (restante <= 10 * 60 * 1000) el.className = 'jogo-timer muito-urgente';
    else if (restante <= 60 * 60 * 1000) el.className = 'jogo-timer urgente';
    else                                 el.className = 'jogo-timer';
  });

  if (travouAlgum) recontarTravados();
}

function travarCard(jogo) {
  const card = document.getElementById('card_' + jogo.id);
  if (!card) return;
  card.classList.add('travado');
  ['g1_', 'g2_'].forEach(p => {
    const inp = document.getElementById(p + jogo.id);
    if (inp) { inp.disabled = true; inp.removeAttribute('oninput'); }
  });
}

function recontarTravados() {
  const n = jogos.filter(j => palpiteEncerrado(j)).length;
  const info = document.getElementById('travasInfo');
  if (info) info.textContent = n > 0 ? `🔒 ${n} jogo(s) encerrado(s) para edição` : '';
}

function fmt(iso) {
  return new Date(iso + 'T12:00:00').toLocaleDateString('pt-BR', { day: '2-digit', month: '2-digit' });
}

function reg(id) {
  const g1 = document.getElementById('g1_' + id).value;
  const g2 = document.getElementById('g2_' + id).value;
  const card = document.getElementById('card_' + id);
  if (g1 !== '' && g2 !== '') {
    palpites[id] = { jogoId: id, gols1: parseInt(g1), gols2: parseInt(g2) };
    card.classList.add('tem-palpite');
  } else {
    delete palpites[id];
    card.classList.remove('tem-palpite');
  }
  atualizarContador();
}

function atualizarContador() {
  const total = jogos.length;
  const preenchidos = Object.keys(palpites).length;
  const novos = Object.keys(palpites).filter(id => {
    const s = palpitesSalvos[id];
    const p = palpites[id];
    return !s || s.gols1 !== p.gols1 || s.gols2 !== p.gols2;
  }).length;

  document.getElementById('contadorPalpites').textContent =
    `${preenchidos} de ${total} jogos preenchidos`;

  const fab = document.getElementById('fabSalvar');
  document.getElementById('fabCount').textContent = novos;
  if (novos > 0) fab.classList.add('visivel');
  else fab.classList.remove('visivel');
}

async function salvarTudo() {
  // Filtra apenas palpites editáveis (jogos não travados)
  const lista = Object.values(palpites).filter(p => {
    const jogo = jogos.find(j => j.id == p.jogoId);
    return jogo && !palpiteEncerrado(jogo);
  });

  if (!lista.length) { toast('Nenhum palpite novo para salvar.', 'aviso'); return; }

  const fab = document.getElementById('fabSalvar');
  fab.innerHTML = 'Salvando…';
  fab.disabled = true;

  const res = await api({ action: 'salvarPalpites', id: participanteId, palpites: lista });

  fab.disabled = false;
  fab.innerHTML = '💾 Salvar <span class="fab-count" id="fabCount">0</span>';
  atualizarContador();

  if (res.ok) {
    // Atualizar palpitesSalvos e exibir confirmação em cada card
    lista.forEach(p => {
      palpitesSalvos[p.jogoId] = { gols1: p.gols1, gols2: p.gols2 };
      const card = document.getElementById('card_' + p.jogoId);
      if (!card) return;
      const salvDiv = card.querySelector('.palpite-salvo');
      const txt = `✓ salvo: ${p.gols1} × ${p.gols2}`;
      if (salvDiv) salvDiv.textContent = txt;
      else {
        const centro = card.querySelector('[style*="text-align:center"]');
        if (centro) centro.insertAdjacentHTML('beforeend', `<div class="palpite-salvo">${txt}</div>`);
      }
    });
    toast(`${lista.length} palpite(s) salvos!`, 'ok');
  } else {
    toast(res.msg || 'Erro ao salvar.', 'erro');
  }
}

window.onload = async () => {
  const id = localStorage.getItem('bolao_id');
  if (id) { document.getElementById('inputId').value = id; await verificarAcesso(); }
};
</script>
