<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#1A237E">
  <title>Jogos & Tabela — Bolão Copa 2026</title>
  <link rel="stylesheet" href="style.css">
  <script src="config.js"></script>
  <style>
    /* ── Cabeçalho de seção ──────────────────────────────────── */
    .sec-titulo {
      font-size: .8rem;
      font-weight: 800;
      color: var(--cinza-sub);
      text-transform: uppercase;
      letter-spacing: .06em;
      margin: 1.2rem 0 .6rem;
      display: flex;
      align-items: center;
      gap: .5rem;
    }
    .sec-titulo::before {
      content: '';
      width: 3px; height: 1em;
      background: var(--ouro);
      border-radius: 2px;
    }

    /* ── Indicador de auto-refresh ───────────────────────────── */
    .auto-refresh {
      display: flex;
      align-items: center;
      gap: .35rem;
      font-size: .72rem;
      color: var(--cinza-sub);
      font-weight: 600;
      margin-bottom: .2rem;
    }
    .auto-refresh .dot {
      width: 7px; height: 7px;
      border-radius: 50%;
      background: #2E7D32;
      animation: pulse-dot 1.6s ease-in-out infinite;
    }
    @keyframes pulse-dot { 50% { opacity: .3; } }

    /* ── Rótulo do dia ───────────────────────────────────────── */
    .dia-label {
      font-size: .7rem;
      font-weight: 800;
      color: var(--azul);
      background: var(--azul-fundo);
      border-radius: 6px;
      padding: .25rem .6rem;
      display: inline-block;
      margin: .5rem 0 .5rem;
    }

    /* ── Card de jogo ────────────────────────────────────────── */
    .jcard {
      background: var(--branco);
      border: 2px solid var(--cinza-borda);
      border-radius: var(--radius-sm);
      padding: .7rem .9rem;
      margin-bottom: .55rem;
    }
    .jcard.destaque {
      border-color: var(--ouro);
      background: var(--ouro-claro);
      box-shadow: 0 2px 12px rgba(249,168,37,.25);
    }
    .destaque-badge {
      font-size: .65rem;
      font-weight: 800;
      color: var(--ouro-escuro);
      text-transform: uppercase;
      letter-spacing: .05em;
      margin-bottom: .4rem;
      display: flex;
      align-items: center;
      gap: .3rem;
    }
    .jc-main {
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: center;
      gap: .5rem;
    }
    .jc-main .t {
      display: flex;
      align-items: center;
      gap: .35rem;
      font-weight: 700;
      font-size: .85rem;
      line-height: 1.2;
    }
    .jc-main .t.right { justify-content: flex-end; text-align: right; }
    .jc-main .t .bd { font-size: 1.4rem; flex-shrink: 0; }
    .t-centro { text-align: center; min-width: 64px; }
    .t-centro .grp { font-size: .62rem; color: var(--cinza-sub); font-weight: 700; }
    .t-centro .hora { font-size: 1.05rem; font-weight: 900; color: var(--azul); }
    .t-centro .placar-final {
      font-size: 1.3rem; font-weight: 900; color: var(--azul); line-height: 1.1;
    }
    .t-centro .placar-final span { color: var(--cinza-sub); font-size: .9rem; }

    /* Rodapé do card */
    .rod-linha {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: .5rem;
      margin-top: .55rem;
      padding-top: .5rem;
      border-top: 1px solid var(--cinza-fundo);
      flex-wrap: wrap;
    }
    .flag-pal {
      font-size: .68rem;
      font-weight: 800;
      padding: .15rem .5rem;
      border-radius: 5px;
      white-space: nowrap;
    }
    .flag-pal.ok { background: #E8F5E9; color: #1B5E20; }
    .flag-pal.no { background: #FFF3E0; color: #BF360C; }
    .timer {
      font-size: .68rem;
      font-weight: 700;
      color: var(--cinza-sub);
      white-space: nowrap;
      margin-left: auto;
    }
    .timer.urg { color: var(--ouro-escuro); }
    .timer.muito {
      color: #fff; background: var(--vermelho);
      padding: .1rem .4rem; border-radius: 4px;
      animation: pulse-dot 1s ease-in-out infinite;
    }
    .timer.enc { color: var(--cinza-sub); opacity: .8; }
    .rod-enc {
      margin-top: .5rem; padding-top: .45rem;
      border-top: 1px solid var(--cinza-fundo);
      font-size: .7rem; font-weight: 800; color: #1B5E20;
    }

    /* ── Pílulas de grupo ────────────────────────────────────── */
    .pills {
      display: flex;
      gap: .4rem;
      overflow-x: auto;
      padding-bottom: .4rem;
      margin-bottom: .6rem;
    }
    .pill {
      flex-shrink: 0;
      background: var(--branco);
      color: var(--cinza-sub);
      font-weight: 800;
      font-size: .82rem;
      padding: .35rem .8rem;
      border-radius: 16px;
      border: 1.5px solid var(--cinza-borda);
      cursor: pointer;
      transition: all .15s;
    }
    .pill.ativa { background: var(--azul); color: #fff; border-color: var(--azul); }

    /* ── Tabela de classificação ─────────────────────────────── */
    .tabela-wrap {
      background: var(--branco);
      border: 1px solid var(--cinza-borda);
      border-radius: var(--radius-sm);
      overflow: hidden;
    }
    table.classif {
      width: 100%;
      border-collapse: collapse;
      font-size: .82rem;
      table-layout: fixed;
    }
    table.classif th {
      background: var(--azul);
      color: #fff;
      padding: .5rem .15rem;
      font-size: .66rem;
      font-weight: 700;
    }
    table.classif th.time-col, table.classif td.time-col { text-align: left; padding-left: .5rem; }
    table.classif td {
      padding: .5rem .15rem;
      text-align: center;
      border-top: 1px solid #ECEFF1;
    }
    table.classif td.time-col { font-weight: 700; }
    table.classif td .bd { font-size: 1.1rem; vertical-align: -3px; margin-right: .15rem; }
    table.classif td.pos { font-weight: 900; color: var(--cinza-sub); }
    table.classif td.pts { font-weight: 900; color: var(--azul); }
    table.classif tr.zona { background: #F1F8E9; }
    table.classif tr.zona td { border-left: none; }
    table.classif tr.zona td.pos { color: #2E7D32; }
    .tabela-legenda {
      padding: .5rem .7rem;
      font-size: .68rem;
      color: var(--cinza-sub);
      background: #FAFAFA;
      border-top: 1px solid #ECEFF1;
      display: flex; align-items: center; gap: .4rem;
    }
    .tabela-legenda .sw { width: 9px; height: 9px; background: #2E7D32; border-radius: 2px; flex-shrink: 0; }
    .vazio { text-align: center; color: var(--cinza-sub); padding: 1.5rem 0; font-size: .85rem; }
  </style>
</head>
<body>

<header>
  <span class="logo">📅</span>
  <div class="header-texto">
    <h1>Jogos &amp; Tabela</h1>
  </div>
  <nav>
    <a href="index.html">Início</a>
    <a href="ranking.html">Ranking</a>
    <a href="palpites.html">Palpites</a>
    <a href="regulamento.html">Regras</a>
  </nav>
</header>

<div class="container">

  <div class="auto-refresh">
    <span class="dot"></span> Atualização automática a cada 1 minuto
  </div>

  <!-- Próximos jogos -->
  <div class="sec-titulo">Próximos jogos</div>
  <div id="proximos">
    <div class="vazio">Carregando…</div>
  </div>

  <!-- Classificação -->
  <div class="sec-titulo">Classificação dos grupos</div>
  <div class="pills" id="pills"></div>
  <div class="tabela-wrap" id="tabela">
    <div class="vazio">Carregando…</div>
  </div>

</div>

<script>
let JOGOS = [];
let RESULTADOS = {};
const MEUS_PALPITES = {};
let GRUPOS = {};
let grupoAtivo = 'A';
let temLogin = false;
let refreshInterval = null;
let timerInterval = null;

const ANTECEDENCIA_MS = 5 * 60 * 1000;

// ── Helpers de horário (iguais aos de palpites.html) ─────────
function horarioJogo(j) {
  const [h, m] = j.hora.replace('h30',':30').replace('h',':00').split(':');
  return new Date(j.data + 'T' + String(h).padStart(2,'0') + ':' + (m||'00') + ':00-03:00');
}
function prazoLimite(j) { return horarioJogo(j).getTime() - ANTECEDENCIA_MS; }
function palpiteEncerrado(j) { return Date.now() >= prazoLimite(j); }

function formatarTempo(ms) {
  const t = Math.floor(ms / 1000);
  const d = Math.floor(t / 86400);
  const h = Math.floor((t % 86400) / 3600);
  const m = Math.floor((t % 3600) / 60);
  const s = t % 60;
  if (d > 0) return `fecha em ${d}d ${h}h`;
  if (h > 0) return `fecha em ${h}h ${String(m).padStart(2,'0')}min`;
  if (m > 0) return `fecha em ${m}min ${String(s).padStart(2,'0')}s`;
  return `fecha em ${s}s`;
}

// Fetch silencioso (sem overlay de loading) para o auto-refresh
async function apiSilent(body) {
  const r = await fetch(CONFIG.API_URL, { method: 'POST', body: JSON.stringify(body), redirect: 'follow' });
  return r.json();
}

// ── Inicialização ────────────────────────────────────────────
async function init() {
  const id = localStorage.getItem('bolao_id');
  temLogin = !!id;

  const chamadas = [
    api({ action: 'getJogos' }),
    api({ action: 'getResultadosPublico' })
  ];
  if (id) chamadas.push(api({ action: 'getMeusPalpites', id }));

  const [rj, rr, rp] = await Promise.all(chamadas);
  if (rj.ok) JOGOS = rj.jogos;
  if (rr && rr.ok) RESULTADOS = rr.resultados || {};
  if (rp && rp.ok && rp.palpites) {
    rp.palpites.forEach(p => { MEUS_PALPITES[p.jogoId] = { gols1: p.gols1, gols2: p.gols2 }; });
  }

  construirGrupos();
  if (!GRUPOS[grupoAtivo]) grupoAtivo = Object.keys(GRUPOS).sort()[0] || 'A';

  renderProximos();
  renderPills();
  renderTabela();
  iniciarTimers();
  iniciarAutoRefresh();
}

function construirGrupos() {
  GRUPOS = {};
  JOGOS.forEach(j => {
    if (!GRUPOS[j.grupo]) GRUPOS[j.grupo] = [];
    [j.time1, j.time2].forEach(t => { if (!GRUPOS[j.grupo].includes(t)) GRUPOS[j.grupo].push(t); });
  });
}

// ── Próximos jogos (hoje + amanhã) ───────────────────────────
function dataBR(d) { return d.toLocaleDateString('en-CA', { timeZone: 'America/Sao_Paulo' }); }
function rotuloDia(s) { const p = s.split('-'); return p[2] + '/' + p[1]; }

function renderProximos() {
  const hoje = dataBR(new Date());
  const amanha = dataBR(new Date(Date.now() + 86400000));
  const lista = JOGOS
    .filter(j => j.data === hoje || j.data === amanha)
    .sort((a, b) => horarioJogo(a) - horarioJogo(b));

  const cont = document.getElementById('proximos');
  if (!lista.length) {
    cont.innerHTML = '<div class="vazio">Nenhum jogo hoje ou amanhã.</div>';
    return;
  }

  const agora = Date.now();
  const destaque = lista.find(j => horarioJogo(j).getTime() > agora);
  const destaqueId = destaque ? destaque.id : null;

  let html = '', diaAtual = '';
  lista.forEach(j => {
    const dia = (j.data === hoje ? 'HOJE · ' : 'AMANHÃ · ') + rotuloDia(j.data);
    if (dia !== diaAtual) { diaAtual = dia; html += `<div class="dia-label">${dia}</div>`; }
    html += cardJogo(j, j.id === destaqueId);
  });
  cont.innerHTML = html;
  aplicarTwemoji(cont);
}

function cardJogo(j, destaque) {
  const f1 = BANDEIRAS[j.time1] || '🏳', f2 = BANDEIRAS[j.time2] || '🏳';
  const n1 = NOMES[j.time1] || j.time1, n2 = NOMES[j.time2] || j.time2;
  const r = RESULTADOS[j.id];

  let centro, rodape;
  if (r) {
    centro = `<div class="grp">Grupo ${j.grupo}</div><div class="placar-final">${r.gols1} <span>×</span> ${r.gols2}</div>`;
    rodape = `<div class="rod-enc">✔ Jogo encerrado</div>`;
  } else {
    centro = `<div class="grp">Grupo ${j.grupo}</div><div class="hora">${j.hora}</div>`;
    let flag = '';
    if (temLogin) {
      const p = MEUS_PALPITES[j.id];
      flag = p
        ? `<span class="flag-pal ok">✓ Palpitado ${p.gols1}×${p.gols2}</span>`
        : `<span class="flag-pal no">✗ Sem palpite</span>`;
    }
    rodape = `<div class="rod-linha">${flag}<span class="timer" id="t_${j.id}"></span></div>`;
  }

  return `<div class="jcard${destaque ? ' destaque' : ''}">
    ${destaque ? '<div class="destaque-badge">⭐ Próximo jogo</div>' : ''}
    <div class="jc-main">
      <div class="t left"><span class="bd">${f1}</span><span>${n1}</span></div>
      <div class="t-centro">${centro}</div>
      <div class="t right"><span>${n2}</span><span class="bd">${f2}</span></div>
    </div>
    ${rodape}
  </div>`;
}

// ── Timers regressivos ───────────────────────────────────────
function iniciarTimers() {
  if (timerInterval) clearInterval(timerInterval);
  atualizarTimers();
  timerInterval = setInterval(atualizarTimers, 1000);
}
function atualizarTimers() {
  const agora = Date.now();
  JOGOS.forEach(j => {
    const el = document.getElementById('t_' + j.id);
    if (!el) return;
    if (RESULTADOS[j.id]) { el.textContent = ''; return; }
    const rest = prazoLimite(j) - agora;
    if (rest <= 0) { el.className = 'timer enc'; el.textContent = '🔒 Palpite encerrado'; return; }
    el.textContent = '⏱ ' + formatarTempo(rest);
    el.className = rest <= 10 * 60 * 1000 ? 'timer muito' : rest <= 60 * 60 * 1000 ? 'timer urg' : 'timer';
  });
}

// ── Classificação ────────────────────────────────────────────
function renderPills() {
  const cont = document.getElementById('pills');
  cont.innerHTML = Object.keys(GRUPOS).sort()
    .map(g => `<span class="pill${g === grupoAtivo ? ' ativa' : ''}" onclick="selGrupo('${g}')">${g}</span>`)
    .join('');
}
function selGrupo(g) { grupoAtivo = g; renderPills(); renderTabela(); }

function calcStats(codes, jogosG) {
  const st = {};
  codes.forEach(c => st[c] = { code: c, pts: 0, j: 0, v: 0, e: 0, d: 0, gf: 0, ga: 0, sg: 0 });
  jogosG.forEach(j => {
    const r = RESULTADOS[j.id];
    if (!r) return;
    const g1 = parseInt(r.gols1), g2 = parseInt(r.gols2);
    if (isNaN(g1) || isNaN(g2)) return;
    const a = st[j.time1], b = st[j.time2];
    if (!a || !b) return;
    a.j++; b.j++;
    a.gf += g1; a.ga += g2; b.gf += g2; b.ga += g1;
    if (g1 > g2)      { a.v++; a.pts += 3; b.d++; }
    else if (g2 > g1) { b.v++; b.pts += 3; a.d++; }
    else              { a.e++; b.e++; a.pts++; b.pts++; }
  });
  Object.values(st).forEach(s => s.sg = s.gf - s.ga);
  return st;
}

// Ordenação FIFA: pontos → saldo → gols pró → confronto direto (pts, saldo, gols)
function ordenarGrupo(arr, jogosG) {
  const cmp = (a, b) => b.pts - a.pts || b.sg - a.sg || b.gf - a.gf;
  arr = arr.slice().sort(cmp);
  const resultado = [];
  let i = 0;
  while (i < arr.length) {
    let k = i + 1;
    while (k < arr.length && arr[k].pts === arr[i].pts && arr[k].sg === arr[i].sg && arr[k].gf === arr[i].gf) k++;
    const empatados = arr.slice(i, k);
    if (empatados.length > 1) {
      const codes = empatados.map(t => t.code);
      const jogosH2H = jogosG.filter(g => codes.includes(g.time1) && codes.includes(g.time2));
      const h2h = calcStats(codes, jogosH2H);
      empatados.sort((a, b) => {
        const ha = h2h[a.code], hb = h2h[b.code];
        return hb.pts - ha.pts || hb.sg - ha.sg || hb.gf - ha.gf || a.code.localeCompare(b.code);
      });
    }
    resultado.push(...empatados);
    i = k;
  }
  return resultado;
}

function renderTabela() {
  const codes = GRUPOS[grupoAtivo] || [];
  const jogosG = JOGOS.filter(j => j.grupo === grupoAtivo);
  const arr = ordenarGrupo(Object.values(calcStats(codes, jogosG)), jogosG);

  const corpo = arr.map((s, i) => {
    const f = BANDEIRAS[s.code] || '🏳';
    const sg = s.sg > 0 ? '+' + s.sg : (s.sg < 0 ? '−' + Math.abs(s.sg) : '0');
    return `<tr class="${i < 2 ? 'zona' : ''}">
      <td class="pos">${i + 1}</td>
      <td class="time-col"><span class="bd">${f}</span>${s.code}</td>
      <td class="pts">${s.pts}</td>
      <td>${s.j}</td>
      <td>${s.v}</td>
      <td>${s.e}</td>
      <td>${s.d}</td>
      <td>${sg}</td>
    </tr>`;
  }).join('');

  document.getElementById('tabela').innerHTML = `
    <table class="classif">
      <thead>
        <tr>
          <th style="width:10%;">#</th>
          <th class="time-col" style="width:34%;">Time</th>
          <th style="width:11%;">P</th>
          <th style="width:9%;">J</th>
          <th style="width:9%;">V</th>
          <th style="width:9%;">E</th>
          <th style="width:9%;">D</th>
          <th style="width:9%;">SG</th>
        </tr>
      </thead>
      <tbody>${corpo}</tbody>
    </table>
    <div class="tabela-legenda"><span class="sw"></span> Zona de classificação (2 primeiros)</div>`;
  aplicarTwemoji(document.getElementById('tabela'));
}

// ── Auto-refresh (near real-time) ────────────────────────────
function iniciarAutoRefresh() {
  if (refreshInterval) clearInterval(refreshInterval);
  refreshInterval = setInterval(async () => {
    if (document.hidden) return;
    try {
      const rr = await apiSilent({ action: 'getResultadosPublico' });
      if (rr.ok) {
        RESULTADOS = rr.resultados || {};
        renderProximos();
        renderTabela();
        atualizarTimers();
      }
    } catch (e) {}
  }, 60000);
}

window.onload = init;
</script>
